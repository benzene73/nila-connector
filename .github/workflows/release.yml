name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Resolve version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "NILA_CONNECTOR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: dotnet restore
      - run: dotnet test --configuration Release --no-restore
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:NILA_CONNECTOR_VERSION
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NilaConnector-${{ env.NILA_CONNECTOR_VERSION }}-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/installer/*.exe --generate-notes --verify-tag
